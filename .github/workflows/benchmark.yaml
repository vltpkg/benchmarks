name: Package Manager Benchmarks
on:
  push:
  workflow_dispatch:
    inputs:
      fixtures:
        description: "The fixture to run the benchmarks on"
        default: '["next", "astro", "vue", "svelte", "large", "babylon"]'
      variations:
        description: "The benchmark variations to run (build/build-cache/run are added via matrix include pairs)"
        default: '["clean", "node_modules", "cache", "cache+node_modules", "cache+lockfile", "cache+lockfile+node_modules", "lockfile", "lockfile+node_modules", "registry-clean", "registry-lockfile"]'
      binaries:
        description: "The binaries to run the benchmarks on"
        default: '"npm,yarn,berry,zpm,pnpm,pacquet,vlt,bun,deno,aube,nx,turbo,vp,node"'
      warmup:
        description: "The number of warmup runs on each benchmark"
        default: "2"
      runs:
        description: "The number of runs on each benchmark"
        default: "5"
  schedule:
    # GitHub Actions cron uses UTC. 10:17 UTC ~= 2:17 AM Pacific (PST).
    - cron: "17 10 * * *"

# Prevent multiple runs from interfering with each other
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-bust
  cancel-in-progress: true

jobs:
  detect-changes:
    name: "Detect Changes"
    runs-on: ubuntu-24.04-arm
    outputs:
      app_only: ${{ steps.check.outputs.app_only }}
      partial_run: ${{ steps.partial.outputs.partial_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Check changed files
        id: check
        run: |
          # For scheduled runs and manual triggers, always run benchmarks
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "app_only=false" >> "$GITHUB_OUTPUT"
            echo "Non-push event (${{ github.event_name }}), running full benchmarks"
            exit 0
          fi

          # Get the list of changed files between this push and the previous commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "app_only=false" >> "$GITHUB_OUTPUT"
            echo "Could not determine changed files, running full benchmarks"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # Check if ALL changed files are under app/ (or non-benchmark files like README, .editorconfig)
          APP_ONLY=true
          while IFS= read -r file; do
            case "$file" in
              app/*|README.md|.editorconfig|.cursor/*|.github/workflows/*)
                # App or non-benchmark files — safe to skip benchmarks
                ;;
              *)
                # Benchmark-relevant file changed
                APP_ONLY=false
                echo "Benchmark-relevant file changed: $file"
                break
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo "app_only=$APP_ONLY" >> "$GITHUB_OUTPUT"
          echo "App-only changes: $APP_ONLY"
      - name: Detect partial run
        id: partial
        env:
          IN_FIXTURES: ${{ inputs.fixtures || '' }}
          IN_VARIATIONS: ${{ inputs.variations || '' }}
          IN_BINARIES: ${{ inputs.binaries || '' }}
          IN_WARMUP: ${{ inputs.warmup || '' }}
          IN_RUNS: ${{ inputs.runs || '' }}
        run: |
          # A dispatch with any non-default input produces a partial/tuned data
          # set: results stay in artifacts + logs but must not deploy to
          # gh-pages, where missing variants break chart rendering for the day.
          partial=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            [[ "$IN_FIXTURES" == '["next", "astro", "vue", "svelte", "large", "babylon"]' ]] || partial=true
            [[ "$IN_VARIATIONS" == '["clean", "node_modules", "cache", "cache+node_modules", "cache+lockfile", "cache+lockfile+node_modules", "lockfile", "lockfile+node_modules", "registry-clean", "registry-lockfile"]' ]] || partial=true
            [[ "$IN_BINARIES" == '"npm,yarn,berry,zpm,pnpm,pacquet,vlt,bun,deno,aube,nx,turbo,vp,node"' ]] || partial=true
            [[ "$IN_WARMUP" == "2" ]] || partial=true
            [[ "$IN_RUNS" == "5" ]] || partial=true
          fi
          echo "partial_run=$partial" >> "$GITHUB_OUTPUT"
          if [[ "$partial" == "true" ]]; then
            echo "::notice::Partial run detected (non-default dispatch inputs) — gh-pages deploy will be skipped; results live in job logs and artifacts."
          fi

  benchmark:
    name: "Run Benchmarks"
    runs-on: ubuntu-24.04-arm
    needs: [detect-changes]
    if: needs.detect-changes.outputs.app_only != 'true'
    timeout-minutes: 120
    environment: Benchmark
    strategy:
      fail-fast: false
      matrix:
        fixture: ${{ fromJson((github.event_name == 'push' && github.ref != 'refs/heads/main') && '["next", "astro", "vue", "svelte"]' || (inputs.fixtures || '["next", "astro", "vue", "svelte", "large", "babylon"]')) }}
        variation: ${{ fromJson(inputs.variations || '["clean", "node_modules", "cache", "cache+node_modules", "cache+lockfile", "cache+lockfile+node_modules", "lockfile", "lockfile+node_modules", "registry-clean", "registry-lockfile"]') }}
        include:
          - variation: "build"
            fixture: "next"
          - variation: "build-cache"
            fixture: "next"
          - variation: "run"
            fixture: "run"
    permissions:
      contents: read
      id-token: write
    env:
      BENCH_INCLUDE: ${{ fromJson(inputs.binaries || '"npm,yarn,berry,zpm,pnpm,pacquet,vlt,bun,deno,aube,nx,turbo,vp,node"') }}
      BENCH_WARMUP: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && '1' || (inputs.warmup || '2') }}
      BENCH_RUNS: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && '1' || (inputs.runs || '5') }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install & Setup Tools
        run: |
          bash ./scripts/setup.sh
      - name: Configure AWS Credentials
        if: startsWith(matrix.variation, 'registry-')
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Get CodeArtifact Token
        if: startsWith(matrix.variation, 'registry-')
        id: aws
        run: |
          CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token \
            --domain vlt \
            --domain-owner 451504312483 \
            --region us-east-1 \
            --query authorizationToken \
            --output text)
          echo "::add-mask::$CODEARTIFACT_AUTH_TOKEN"
          echo "token=$CODEARTIFACT_AUTH_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Tune benchmark settings
        id: tune
        run: |
          # Start with defaults
          warmup="$BENCH_WARMUP"
          runs="$BENCH_RUNS"

          # Heavy fixtures (large, babylon) get reduced warmup/runs to keep
          # individual jobs under the timeout while still producing useful data.
          case "${{ matrix.fixture }}" in
            large|babylon)
              warmup=1
              runs=3
              echo "Heavy fixture detected — using warmup=$warmup, runs=$runs"
              ;;
          esac

          # Registry variations also get reduced runs (6 registries × iterations must fit in 90min)
          case "${{ matrix.variation }}" in
            registry-*)
              warmup=1
              runs=3
              echo "Registry variation detected — using warmup=$warmup, runs=$runs"
              ;;
          esac

          echo "warmup=$warmup" >> "$GITHUB_OUTPUT"
          echo "runs=$runs" >> "$GITHUB_OUTPUT"
      - name: Run Benchmarks variations
        env:
          VLT_REGISTRY: https://registry.vlt.io/vlt/npm/
          VLT_TOKEN: ${{ secrets.VLT_REGISTRY_AUTH_TOKEN }}
          CODEARTIFACT_AUTH_TOKEN: ${{ steps.aws.outputs.token }}
          CLOUDSMITH_REGISTRY: ${{ secrets.CLOUDSMITH_REGISTRY }}
          CLOUDSMITH_TOKEN: ${{ secrets.CLOUDSMITH_TOKEN }}
          GH_REGISTRY: ${{ secrets.GH_REGISTRY }}
          GH_AUTH_TOKEN: ${{ secrets.GH_AUTH_TOKEN }}
          JFROG_REGISTRY: ${{ secrets.JFROG_REGISTRY }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
          BENCH_WARMUP: ${{ steps.tune.outputs.warmup }}
          BENCH_RUNS: ${{ steps.tune.outputs.runs }}
        run: |
          ./bench run \
            --fixtures="${{ matrix.fixture }}" \
            --variation="${{ matrix.variation }}"
      - name: Upload Benchmark Results
        uses: actions/upload-artifact@v7
        with:
          name: results-${{ matrix.fixture }}-${{ matrix.variation }}
          path: ./results/${{ matrix.fixture }}/${{ matrix.variation }}/
          retention-days: 7
      - name: Upload Versions Info
        uses: actions/upload-artifact@v7
        with:
          name: versions-${{ matrix.fixture }}-${{ matrix.variation }}
          path: ./results/versions.json
          retention-days: 7
  process:
    name: "Process Results"
    runs-on: ubuntu-24.04-arm
    needs: [detect-changes, benchmark]
    if: needs.detect-changes.outputs.app_only != 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Download Results
        uses: actions/download-artifact@v8
        with:
          path: results
          pattern: results-*
      - name: Download Versions
        uses: actions/download-artifact@v8
        with:
          path: versions-temp
          pattern: versions-*
      - name: Scan Raw Registry Results
        id: registry-raw
        # Any non-zero vlt exit code is a potential outage or misconfiguration.
        # This must run before `bench process`, which rewrites exit codes in
        # place (dropping failed runs), so raw per-run failures are only
        # visible here.
        if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.partial_run != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const failures = []

            for (const entry of fs.readdirSync('results').sort()) {
              const match = /^results-(.+)-(registry-[a-z]+)$/.exec(entry)
              if (!match) continue
              const file = path.join('results', entry, 'benchmarks.json')
              if (!fs.existsSync(file)) continue
              const label = `${match[1]} ${match[2]}`

              const vlt = (JSON.parse(fs.readFileSync(file, 'utf8')).results ?? [])
                .find((r) => r.command === 'vlt')
              if (!vlt) {
                failures.push(`- **${label}**: no vlt result`)
                continue
              }
              const codes = vlt.exit_codes ?? []
              const bad = codes.filter((c) => c !== 0)
              if (bad.length) {
                failures.push(`- **${label}**: ${bad.length}/${codes.length} runs failed (exit codes: ${bad.join(', ')})`)
              }
            }

            core.info(failures.length ? `vlt registry run failures:\n${failures.join('\n')}` : 'all vlt registry runs succeeded')
            core.setOutput('vlt_failures', failures.join('\n'))
      - name: Process Results
        run: |
          ./bench process
      - name: Summarize results in log
        run: |
          {
            echo '```'
            for f in results/results-*/benchmarks.json; do
              [ -f "$f" ] || continue
              node -e '
                const fs = require("fs")
                const p = process.argv[1]
                const name = p.split("/")[1].replace(/^results-/, "")
                for (const r of JSON.parse(fs.readFileSync(p, "utf8")).results ?? []) {
                  const times = (r.times ?? []).map((t) => t.toFixed(1)).join(", ")
                  console.log(`${name}  ${r.command}: mean=${(r.mean ?? 0).toFixed(1)}s times=[${times}]`)
                }
              ' "$f"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install vlt
        run: |
          npm install -g vlt@latest
      - name: Build Charts View
        run: |
          pushd app
          vlt install
          vlt run build
          popd
      - name: Upload Processed Results
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: results/
          retention-days: 7
      - name: Check Registry Results
        id: registry-check
        # Same gate as the deploy job: alert exactly when these results will
        # be published to the site.
        if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.partial_run != 'true'
        uses: actions/github-script@v9
        env:
          VLT_FAILURES: ${{ steps.registry-raw.outputs.vlt_failures }}
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            // vlt must be more than 10% behind the fastest registry before a
            // difference counts as noticeably slower.
            const THRESHOLD = 1.1
            const slower = []

            // Compare the processed files that get deployed to the site so an
            // alert fires exactly when vlt appears slower on the site.
            // Registry variations are the only ones where `command` is a
            // registry name rather than a package manager.
            const dir = 'results/latest'
            for (const entry of fs.readdirSync(dir).sort()) {
              const match = /^(.+)-(registry-[a-z]+)\.json$/.exec(entry)
              if (!match) continue
              const label = `${match[1]} ${match[2]}`

              // Registries where every run failed are stamped with a non-zero
              // exit code and a zero mean by clean-benchmarks and rendered as
              // failures on the site, so they are excluded from the speed
              // comparison. A failed vlt is already reported by the raw scan.
              const ok = (JSON.parse(fs.readFileSync(path.join(dir, entry), 'utf8')).results ?? [])
                .filter((r) => r.mean > 0 && (r.exit_codes ?? []).every((c) => c === 0))
              const vlt = ok.find((r) => r.command === 'vlt')
              if (!vlt) continue

              const best = ok.reduce((a, b) => (b.mean < a.mean ? b : a))
              if (best.command === 'vlt' || vlt.mean <= best.mean * THRESHOLD) continue
              slower.push(
                `- **${label}**: ${best.command} ${best.mean.toFixed(1)}s vs vlt ${vlt.mean.toFixed(1)}s (${(vlt.mean / best.mean).toFixed(2)}x slower)`
              )
            }

            const failures = process.env.VLT_FAILURES ?? ''
            const message = []
            if (failures) {
              message.push('vlt registry runs failed (potential outage or misconfiguration):', failures)
            }
            if (slower.length) {
              message.push(`vlt was noticeably slower than another registry in ${slower.length} registry benchmarks:`, ...slower)
            }
            core.info(message.length ? message.join('\n') : 'all vlt registry runs succeeded and vlt was the fastest registry')
            core.setOutput('message', message.join('\n'))
      - name: Slack Notify
        if: steps.registry-check.outputs.message != ''
        uses: rtCamp/action-slack-notify@v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_GITHUB_ALERTS_WEBHOOK_URL }}
          SLACK_USERNAME: vltops
          SLACK_CHANNEL: github-alerts
          SLACK_ICON: https://github.com/vltpkg.png
          SLACK_COLOR: warning
          SLACK_FOOTER: ""
          SLACKIFY_MARKDOWN: true
          MSG_MINIMAL: "actions url,commit"
          SLACK_TITLE: vlt Registry Benchmark Alert
          SLACK_MESSAGE: |
            ${{ steps.registry-check.outputs.message }}
  deploy:
    name: "Deploy Results"
    runs-on: ubuntu-24.04-arm
    needs: [detect-changes, process]
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.app_only != 'true' && needs.detect-changes.outputs.partial_run != 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Download Results
        uses: actions/download-artifact@v8
        with:
          name: results
          path: results/
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: results
          keep_files: true

  deploy-app:
    name: "Deploy App Only"
    runs-on: ubuntu-24.04-arm
    needs: [detect-changes]
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.app_only == 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Checkout gh-pages data
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-data
      - name: Install vlt
        run: |
          npm install -g vlt@latest
      - name: Build App
        run: |
          pushd app
          vlt install
          vlt run build
          popd
      - name: Prepare deploy directory
        run: |
          # Copy the latest data files from gh-pages into the built results
          cp -r gh-pages-data/latest results/latest
          # Copy index.html and assets from the fresh build are already in results/
          # The deploy action with keep_files merges with existing gh-pages content
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: results
          keep_files: true

  on-failure:
    name: "Notify on Failure"
    runs-on: ubuntu-24.04-arm
    # !cancelled() so this still runs when an upstream job failed, but stays
    # quiet when the run itself was cancelled (e.g. superseded by a newer push
    # via concurrency), even if a job had already failed before the cancel.
    # Limited to main so branch pushes don't notify.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure') }}
    needs:
      - detect-changes
      - benchmark
      - process
      - deploy
      - deploy-app
    steps:
      - name: Slack Notify
        uses: rtCamp/action-slack-notify@v2.3.3
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_GITHUB_ALERTS_WEBHOOK_URL }}
          SLACK_USERNAME: vltops
          SLACK_CHANNEL: github-alerts
          SLACK_ICON: https://github.com/vltpkg.png
          SLACK_COLOR: failure
          SLACK_FOOTER: ""
          SLACKIFY_MARKDOWN: true
          MSG_MINIMAL: "actions url,commit"
          SLACK_TITLE: Benchmark Run Failed
          SLACK_MESSAGE: |
            The benchmark run failed and needs to be retriggered.
            Detect Changes: ${{ needs.detect-changes.result }}
            Benchmark: ${{ needs.benchmark.result }}
            Process: ${{ needs.process.result }}
            Deploy: ${{ needs.deploy.result }}
            Deploy App: ${{ needs.deploy-app.result }}
