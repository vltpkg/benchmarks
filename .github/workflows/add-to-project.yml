name: Add Issue/PR to Project

on:
  issues:
    types: [opened]
  # Use the base repository's workflow and secret for fork PR metadata.
  # Do not check out or execute pull request code in this workflow.
  pull_request_target:
    types: [opened, reopened]

# Project access comes from PROJECT_PAT; the default token needs no permissions.
permissions: {}

jobs:
  add_to_project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to GitHub Project
        uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/vltpkg/projects/3
          github-token: ${{ secrets.PROJECT_PAT }}
